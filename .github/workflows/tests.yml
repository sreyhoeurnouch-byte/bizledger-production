name: Application tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: bizledger_testing
          MYSQL_USER: bizledger
          MYSQL_PASSWORD: testing-secret
          MYSQL_ROOT_PASSWORD: root-secret
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot-secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: bizledger_testing
      DB_USERNAME: bizledger
      DB_PASSWORD: testing-secret
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Prepare test database
        run: php artisan migrate:fresh --seed --force
      - name: Compile application artifacts
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:cache
      - name: Run tests
        run: php artisan test --compact
